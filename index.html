<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0C272E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Random Sites">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="New World Laboratories random sampling and test site selection to WA 0.1, AS 1289.1.4.1 and AS 1289.1.4.2.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Random Site Locator</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: field tool. Sticky header with step rail, one step on screen at a time, fixed Back/Next bar for thumbs. New World Laboratories navy + green. */
:root{
  --bg:#EDF2F1; --surface:#FFFFFF; --sunk:#F4F7F6; --ink:#0C272E; --muted:#526B6E; --line:#D0DCDA;
  --brand:#16B28B; --accent:#0B7F62; --accent-ink:#FFFFFF; --accent-soft:#DDF4EC;
  --asphalt:#3A4246; --marking:#F2C230; --hatch:#97A6A8;
  --ok:#0B7F62; --ok-soft:#DDF4EC; --warn:#A16207; --warn-soft:#FBF1D9; --bad:#B42318; --bad-soft:#FBE4E1;
  --f-display:"Montserrat","Segoe UI",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1B20; --surface:#10262C; --sunk:#0D2026; --ink:#E6EEEC; --muted:#93AAAB; --line:#213D43;
  --brand:#16B28B; --accent:#22C79D; --accent-ink:#07211A; --accent-soft:#103A30;
  --asphalt:#2B3236; --marking:#E9B71E; --hatch:#6A7A7D;
  --ok:#22C79D; --ok-soft:#103A30; --warn:#E3B341; --warn-soft:#33290F; --bad:#FF7B6E; --bad-soft:#3A1A17;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1B20; --surface:#10262C; --sunk:#0D2026; --ink:#E6EEEC; --muted:#93AAAB; --line:#213D43;
  --brand:#16B28B; --accent:#22C79D; --accent-ink:#07211A; --accent-soft:#103A30;
  --asphalt:#2B3236; --marking:#E9B71E; --hatch:#6A7A7D;
  --ok:#22C79D; --ok-soft:#103A30; --warn:#E3B341; --warn-soft:#33290F; --bad:#FF7B6E; --bad-soft:#3A1A17;
  color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:900px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:700;text-wrap:balance;margin:0}
h2{font-size:1.4rem;line-height:1.15}
h3{font-size:.9rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
p{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.logo-d{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo-l{display:none}:root:not([data-theme="light"]) .logo-d{display:block}}
:root[data-theme="dark"] .logo-l{display:none}:root[data-theme="dark"] .logo-d{display:block}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.top .bar{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.brand img{height:38px;width:auto;flex:none}
.brand div{min-width:0}
.brand em{font-style:normal;display:block;font:600 .66rem var(--f-display);letter-spacing:.2em;text-transform:uppercase;color:var(--brand)}
.brand b{font-family:var(--f-display);font-size:1.02rem;white-space:nowrap;display:block}
.brand small{display:block;color:var(--muted);font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.saved{color:var(--ok);font-weight:600}
.saved.bad{color:var(--bad)}
.steps{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.steps button{flex:none;border:0;background:transparent;color:var(--muted);font:600 .95rem var(--f-body);padding:8px 12px;border-radius:999px;display:flex;gap:6px;align-items:center;cursor:pointer}
.steps button i{font-style:normal;font-family:var(--f-mono);font-size:.78rem;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;border:1.5px solid currentColor}
.steps button[aria-current="step"]{background:var(--ink);color:var(--surface)}
.steps button.done i{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.badge{font:600 .75rem var(--f-mono);background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:1px 7px}

main{padding-block:18px;display:grid;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:14px;min-width:0}
.card.sunk{background:var(--sunk)}
.hint{color:var(--muted);font-size:.92rem;max-width:68ch}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr))}
.grid.two{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.lane .grid,.excl .grid,.grid.tight{grid-template-columns:repeat(auto-fit,minmax(min(100%,130px),1fr))}
label.f{display:flex;flex-direction:column;justify-content:space-between;gap:4px;font-size:.8rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;min-width:0}
input,select,textarea{font:500 1rem var(--f-body);color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:10px 11px;min-height:46px;width:100%;min-width:0}
input.mono{font-family:var(--f-mono)}
input[type=range]{padding:0;border:0;min-height:36px;accent-color:var(--accent);background:transparent}
textarea{min-height:70px;resize:vertical}
#i_datum{min-height:0;height:auto;field-sizing:content}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{font:600 1rem var(--f-body);border-radius:8px;padding:11px 16px;min-height:46px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
a.btn{text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.small{min-height:38px;padding:6px 11px;font-size:.92rem}
.btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.check{display:flex;gap:10px;align-items:center;font-weight:600;cursor:pointer}
.check input{width:22px;height:22px;min-height:0;flex:none;accent-color:var(--accent)}

.methods{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr))}
.method{position:relative;border:1.5px solid var(--line);border-radius:var(--r);padding:12px 14px 12px 44px;cursor:pointer;display:grid;gap:2px;background:var(--surface)}
.method input{position:absolute;left:14px;top:15px;width:20px;height:20px;min-height:0;accent-color:var(--accent)}
.method b{font-family:var(--f-display);font-size:1rem}
.method span{font-size:.88rem;color:var(--muted)}
.method:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1.5px solid var(--line);border-radius:8px;overflow:hidden;width:100%;max-width:440px}
.seg label{position:relative;padding:10px 12px;cursor:pointer;font-weight:600;font-size:.95rem;text-align:center;display:flex;align-items:center;justify-content:center;min-height:46px}
.seg label+label{border-left:1.5px solid var(--line)}
.seg input{position:absolute;inset:0;width:100%;height:100%;min-height:0;margin:0;opacity:0;cursor:pointer}
.seg label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:-3px}
.seg label:has(input:checked){background:var(--ink);color:var(--surface)}

.lane{border:1.5px solid var(--line);border-left:6px solid var(--brand);border-radius:var(--r);padding:12px;display:grid;gap:10px;background:var(--surface)}
.lane header{display:flex;align-items:center;gap:8px}
.lane header b{font-family:var(--f-display);font-size:1rem}
.wpts{display:grid;gap:8px;border-top:1px dashed var(--line);padding-top:10px}.wlab{font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.wrow{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}
.tbl.fit{overflow:visible}
.tbl.fit table{table-layout:fixed}
.tbl.fit th,.tbl.fit td{white-space:normal;padding:7px 6px;overflow-wrap:anywhere}
.tbl.fit th,.tbl.fit td,.tbl.fit td.n{text-align:center}
.tbl.fit .wcell{text-align:center;margin:0 auto;display:block}
.tbl.fit th{font-size:.68rem;line-height:1.25;letter-spacing:.03em}
.ln-name{display:block;color:var(--muted);font-size:.72rem;line-height:1.2}
.wc{padding:4px 4px}
.wcell{width:100%;max-width:84px;min-height:36px;padding:5px 8px;text-align:right;font-size:.92rem;border-style:dashed}
.wcell:focus{border-style:solid}
.wcell.meas,.meas-key{background:var(--warn-soft);border-color:var(--warn);color:var(--ink)}
.meas-key{padding:0 4px;border-radius:4px;border:1px solid var(--warn)}
.excl{border:1.5px dashed var(--hatch);border-radius:var(--r);padding:12px;display:grid;gap:10px}
#lotSummary{display:grid;gap:12px;min-width:0}
.lotgrid,.lotform{display:grid;gap:18px;min-width:0}.lotside{min-width:0}
main.wide{max-width:1280px}
@media (min-width:960px){.lotgrid{grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);align-items:start}.lotside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 120px);max-height:calc(100vh - 140px);overflow:auto}}

.stats{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;grid-template-columns:repeat(2,minmax(0,1fr))}
@container (min-width:560px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
#lotSummary{container-type:inline-size}
.stats div{background:var(--surface);padding:10px 12px;display:grid;gap:2px;min-width:0}
.stats span{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.stats b{font-family:var(--f-mono);font-weight:500;font-size:1.05rem;overflow-wrap:anywhere}
.msg{border-radius:8px;padding:10px 12px;font-size:.93rem;display:grid;gap:4px}
.msg.bad{background:var(--bad-soft);color:var(--bad)}
.msg.warn{background:var(--warn-soft);color:var(--warn)}
.msg.ok{background:var(--ok-soft);color:var(--ok)}

/* schematic */
.schem{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--sunk)}
.schem svg{display:block;width:100%;height:auto}
svg .ln{fill:var(--asphalt)} svg .jt{fill:var(--marking);opacity:.35} svg .hl{stroke:var(--hatch);stroke-width:1.2}
svg .sl{stroke:#FFFFFF;stroke-opacity:.75;stroke-width:1.4;stroke-dasharray:4 4}
svg .st{fill:var(--brand);stroke:#FFFFFF;stroke-width:1.5} svg .st.mv{fill:var(--warn)} svg .st.dn{fill:#FFFFFF;stroke:var(--brand);stroke-width:2.5}
svg .stt{fill:#FFFFFF;font:600 10px var(--f-mono);text-anchor:middle;dominant-baseline:central} svg .stt.dn{fill:#0C272E}
svg .tk{stroke:var(--muted);stroke-width:1} svg .tt{fill:var(--muted);font:10px var(--f-mono)}
svg .lt{fill:var(--ink);font:600 12px var(--f-body)} svg .ltm{fill:var(--muted);font:10px var(--f-mono)}
svg .slt{fill:#FFFFFF;fill-opacity:.6;font:600 9px var(--f-mono)} svg .dtm{stroke:var(--brand);stroke-width:3} svg .lnm{fill:#FFFFFF;fill-opacity:.85;font:600 11px var(--f-body)} svg .mwl{stroke:#F2A60C;stroke-width:3;stroke-linecap:round} svg .mws{fill:#F2A60C;fill-opacity:.55} svg .mwt{fill:var(--warn);font:700 10px var(--f-mono)}

/* tables */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.74rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--sunk);font-weight:600}
td.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.pill{display:inline-block;font:600 .74rem var(--f-body);padding:2px 8px;border-radius:999px;text-transform:uppercase;letter-spacing:.04em}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.mut{background:var(--sunk);color:var(--muted);border:1px solid var(--line)} .pill.acc{background:var(--ink);color:var(--surface)}

/* site cards */
.sites{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.site{border:1.5px solid var(--line);border-radius:var(--r);background:var(--surface);padding:12px;display:grid;gap:10px}
.site.done{border-color:var(--ok)} .site.moved{border-color:var(--warn)}
.site .hd{display:flex;align-items:center;gap:10px}
.dot{width:34px;height:34px;flex:none;border-radius:50%;background:var(--brand);color:#FFFFFF;display:grid;place-items:center;font:600 .95rem var(--f-mono)}
.site.done .dot{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 3px var(--brand)} .site.moved .dot{background:var(--warn);color:#fff}
.site .loc{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.site .loc div{background:var(--sunk);border-radius:8px;padding:8px 10px;min-width:0}
.site .loc span{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.site .loc b{font:500 1.3rem var(--f-mono)}
.site details summary{cursor:pointer;color:var(--muted);font-weight:600;font-size:.92rem;padding-block:4px}
.site details[open]{display:grid;gap:10px}

/* plan overlay */
.mapscroll{overflow:auto;max-height:72vh;border:1px solid var(--line);border-radius:var(--r);background:var(--sunk);touch-action:pan-x pan-y pinch-zoom}
.mapinner{position:relative;width:calc(var(--z,1) * 100%)}
.mapinner img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
.mapinner svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.mapinner.armed{cursor:crosshair}
.mapinner svg .calh{pointer-events:all;cursor:grab;touch-action:none}
.mapinner.dragging,.mapinner.dragging svg .calh{cursor:grabbing}
.mapdrop{transition:box-shadow .15s}
#main.dropping .mapdrop{box-shadow:0 0 0 3px var(--accent)}
.drop.big{padding:40px 16px;border-width:2.5px}
#main.dropping .drop{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.ptlist{display:grid;gap:8px}
.pt{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}
.pt b{font:600 .9rem var(--f-mono);background:var(--ink);color:var(--surface);border-radius:6px;padding:4px 8px}
.slider{display:grid;gap:2px}
.slider .lab{display:flex;justify-content:space-between;font-size:.8rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.slider output{font-family:var(--f-mono);color:var(--ink);text-transform:none;letter-spacing:0}
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:28px 16px;text-align:center;color:var(--muted);display:grid;gap:8px;justify-items:center}

/* bottom bar */
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--surface);border-top:1px solid var(--line);padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-top:10px}
.bottom .wrap{display:flex;gap:10px}
.bottom .btn{flex:1}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;font-weight:600;z-index:40;max-width:calc(100% - 32px)}

/* lots sheet */
.scrim{position:fixed;inset:0;background:rgba(6,18,22,.55);z-index:30;display:grid;align-items:end;justify-items:center}
.sheet{background:var(--surface);width:100%;max-width:680px;max-height:88vh;overflow:auto;border-radius:14px 14px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:12px}
.joblist{display:grid;gap:8px}
.daylabel{font:600 .78rem var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-top:4px}
.job{display:flex;gap:10px;align-items:center;border:1.5px solid var(--line);border-radius:var(--r);padding:10px 12px}
.job input{width:22px;height:22px;min-height:0;flex:none;accent-color:var(--accent)}
.job div{flex:1;min-width:0}
.job b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.job small{color:var(--muted)}
.job.cur{border-color:var(--accent)}
.guidecard{background:var(--accent-soft);border-color:var(--accent)}
.gsheet{position:fixed;inset:0;z-index:35;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.gbar{display:flex;gap:8px;align-items:center;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:var(--surface);border-bottom:1px solid var(--line)}
.gbar b{flex:1;font-family:var(--f-display)}
.gsheet iframe{flex:1;width:100%;border:0;background:var(--bg)}
.confirm{background:var(--bad-soft);border-radius:8px;padding:10px;display:grid;gap:8px;color:var(--bad)}

/* report preview */
.rpbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 118px);z-index:5;background:var(--bg);padding-block:8px;display:flex;gap:8px;flex-wrap:wrap}
.report-host{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:#DDE5E4;padding:8px}
@media (prefers-reduced-motion:no-preference){.btn,.steps button{transition:background .15s,border-color .15s,color .15s}}
#printArea{display:none}
@page{size:A4 portrait;margin:0}
@media print{body.printing>*:not(#printArea){display:none!important}body.printing #printArea{display:block}body.printing{padding:0!important;background:#fff}body.printing::before{display:none}}
</style>
</head>
<body>
<header class="top">

function rnd(dp=4){ const a=new Uint32Array(1); crypto.getRandomValues(a); const k=Math.pow(10,dp); return Math.floor(a[0]/4294967296*k)/k; }
function rndInt(lo,hi){ const a=new Uint32Array(1); crypto.getRandomValues(a); return lo+Math.floor(a[0]/4294967296*(hi-lo+1)); }

/* ---------- storage: IndexedDB on this device (falls back to localStorage) ---------- */
const DBN="nwl-random-sites", ST="lots", LS="nwl.rsl.lots", LS_CUR="nwl.rsl.cur";
let idb=null, saveT=null, lastSaved=null, saveOk=true;
function openDB(){ return new Promise(res=>{ try{ const r=indexedDB.open(DBN,1);
  r.onupgradeneeded=()=>r.result.createObjectStore(ST,{keyPath:"id"}); r.onsuccess=()=>res(r.result); r.onerror=()=>res(null); r.onblocked=()=>res(null); }catch(e){ res(null); } }); }
function idbAll(){ return new Promise(res=>{ try{ const out={}; const c=idb.transaction(ST).objectStore(ST).openCursor();
  c.onsuccess=e=>{ const k=e.target.result; if(k){ out[k.value.id]=k.value; k.continue(); } else res(out); }; c.onerror=()=>res({}); }catch(e){ res({}); } }); }
async function loadAll(){
  idb=await openDB();
  if(idb) jobs=await idbAll();
  if(!idb){ try{ jobs=JSON.parse(localStorage.getItem(LS)||"{}")||{}; }catch(e){ jobs={}; } }
  try{ const old=JSON.parse(localStorage.getItem("rsl.jobs.v1")||"{}"); for(const k in old) if(!jobs[k]){ jobs[k]=old[k]; if(idb) persist(old[k]); } localStorage.removeItem("rsl.jobs.v1"); }catch(e){}
  // the sample lot older versions created is removed if nobody has worked on it
  for(const k in jobs){ const x=jobs[k]; if(x&&x.job&&x.job.client==="EXAMPLE – replace with your job"&&x.job.ticket==="EX-0001"){ delete jobs[k]; if(idb){ try{ idb.transaction(ST,"readwrite").objectStore(ST).delete(k); }catch(e){} } } }
  Object.values(jobs).forEach(normalise);
  let cur=null; try{ cur=localStorage.getItem(LS_CUR); }catch(e){}
  if(cur&&jobs[cur]) S=jobs[cur];
  else { const l=Object.values(jobs).sort((a,b)=>b.updated.localeCompare(a.updated)); S=l[0]||null; }
  if(!S){ S=blankJob(); jobs[S.id]=S; persist(S); }
  try{ navigator.storage&&navigator.storage.persist&&navigator.storage.persist().catch(()=>{}); }catch(e){}
}
function persist(j){
  const done=ok=>{ saveOk=ok; if(ok) lastSaved=new Date(); renderSaved(); };
  if(idb){ try{ const tx=idb.transaction(ST,"readwrite"); tx.objectStore(ST).put(JSON.parse(JSON.stringify(j))); tx.oncomplete=()=>done(true); tx.onerror=tx.onabort=()=>done(false); }catch(e){ done(false); } }
  else { try{ localStorage.setItem(LS,JSON.stringify(jobs)); done(true); }catch(e){ done(false); } }
  try{ localStorage.setItem(LS_CUR,S.id); }catch(e){}
}
function removeStored(id){ if(idb){ try{ idb.transaction(ST,"readwrite").objectStore(ST).delete(id); }catch(e){} } else { try{ localStorage.setItem(LS,JSON.stringify(jobs)); }catch(e){} } }

    s+=`<circle cx="${X}" cy="${cy}" r="${r}" class="${cls}"/><text x="${X}" y="${cy}" class="stt${f.status==="done"?" dn":""}">${st.no}</text>`; });
  const step=niceStep(rng*8/Math.max(3,Math.floor(dw/70)));
  s+=`<line x1="${x(lo)}" y1="${yb}" x2="${x(hi)}" y2="${yb}" class="tk"/>`;
  for(let t=Math.ceil(lo/step)*step;t<=hi+1e-6;t+=step) s+=`<line x1="${x(t)}" y1="${yb}" x2="${x(t)}" y2="${yb+5}" class="tk"/><text x="${x(t)}" y="${yb+16}" class="tt" text-anchor="${x(t)<x0+18?"start":x(t)>x0+dw-18?"end":"middle"}">${j.delin==="slk"?(t/1000).toFixed(3):Math.round(t)}</text>`;
  const sc=ex>1.05?`widths drawn ×${ex<10?ex.toFixed(1):Math.round(ex)}`:"drawn to scale";
  if(!compact&&!narrow) s+=`<text x="${pad}" y="${yb+31}" class="tt" text-anchor="start">${posLabel(j)} · ${sc} · hatched = excluded · yellow = clearance · amber = measured width (m)</text>`;
  if(narrow&&!compact) s+=`<text x="${pad}" y="${yb+30}" class="tt" text-anchor="start">${posLabel(j)} · ${sc}</text><text x="${pad}" y="${yb+43}" class="tt" text-anchor="start">hatched = excluded · yellow = clearance</text><text x="${pad}" y="${yb+56}" class="tt" text-anchor="start">amber = measured width (m)</text>`;
  if(compact) s+=`<text x="${x0+dw}" y="${yb+16+12}" class="tt" text-anchor="end">${sc}</text>`;
  return s+"</svg>";
}

/* ---------- plan overlay: chainage points tapped on the photo → position along the alignment ---------- */
function calFn(j){
  if(!j.photo||!j.cal) return null;
  const pts=j.cal.pts.map(p=>({m:toM(p.ch,j),x:p.x,y:p.y})).filter(p=>isFinite(p.m)).sort((a,b)=>a.m-b.m);
  const segs=[]; let tl=0, tm=0;
  for(let i=0;i<pts.length-1;i++){ const a=pts[i], b=pts[i+1], dm=b.m-a.m, dx=b.x-a.x, dy=b.y-a.y, len=Math.hypot(dx,dy);
    if(dm<=0.01||len<1) continue; segs.push({a,dm,ux:dx/len,uy:dy/len,k:len/dm}); tl+=len; tm+=dm; }
  if(!segs.length) return null;
  const K=tl/tm, side=num(j.cal.side)<0?-1:1, stretch=num(j.cal.stretch)||1, shift=num(j.cal.shift)||0;
  const fn=(m,off)=>{ let s=segs[0]; for(const g of segs) if(m>=g.a.m) s=g;
    const t=m-s.a.m, px=s.a.x+s.ux*t*s.k, py=s.a.y+s.uy*t*s.k, o=(off+shift)*K*stretch;
    return [px-s.uy*side*o, py+s.ux*side*o]; };
  fn.K=K; fn.ms=pts.map(p=>p.m); return fn;
}
function overlaySVG(j,opts={}){
  const f=calFn(j); if(!f) return "";
  const g=geometry(j); if(g.errs.length||g.qty) return "";
  const d=liveDraw(j), W=j.photoW, H=j.photoH, R=Math.max(W,H)/(opts.report?75:55);
  const P=a=>a.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
  const band=(L,a,b,o1,o2)=>{ const F=o=>typeof o==="function"?o:(()=>o); const n=Math.max(2,Math.ceil((b-a)/((L.hi-L.lo)/60))); const ms=[]; for(let i=0;i<=n;i++) ms.push(a+(b-a)*i/n); f.ms.concat(L.wpts).forEach(m=>{ if(m>a&&m<b) ms.push(m); }); ms.sort((p,q)=>p-q);
    return P(ms.map(m=>f(m,F(o1)(m))).concat(ms.slice().reverse().map(m=>f(m,F(o2)(m))))); };
  let s=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg" style="opacity:${num(j.cal.opacity)||0.85}"><defs><pattern id="ovh${opts.report?"r":""}" width="${R*0.7}" height="${R*0.7}" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="${R*0.7}" stroke="#B42318" stroke-width="${R*0.18}"/></pattern></defs>`;
  g.lanes.forEach(L=>{
    s+=`<polygon points="${band(L,L.lo,L.hi,L.dOff,m=>L.dOff+L.W(m))}" fill="#16B28B" fill-opacity=".22" stroke="#0C272E" stroke-width="2.5" vector-effect="non-scaling-stroke"/>`;
    if(g.eJ>0){ s+=`<polygon points="${band(L,L.lo,L.hi,L.dOff,L.dOff+g.eJ)}" fill="#F2C230" fill-opacity=".5"/><polygon points="${band(L,L.lo,L.hi,m=>L.dOff+L.W(m)-g.eJ,m=>L.dOff+L.W(m))}" fill="#F2C230" fill-opacity=".5"/>`; }
    gaps(L).forEach(v=>{ s+=`<polygon points="${band(L,v[0],v[1],L.dOff,m=>L.dOff+L.W(m))}" fill="url(#ovh${opts.report?"r":""})" stroke="#B42318" stroke-width="1.5" vector-effect="non-scaling-stroke"/>`; });
  });
  const nSL=d?(d.strata?d.strata.length:0):(METHODS[j.method].strat&&g.N>1?g.N:0), SS=d?d.S:g.S;
  if(nSL>1) for(let k=1;k<nSL;k++){ const p=mapU(g,k*SS); const a=f(p.ch,p.lane.dOff), b=f(p.ch,p.lane.dOff+p.lane.W(p.ch));
    s+=`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="#FFFFFF" stroke-width="2.5" stroke-dasharray="6 4" vector-effect="non-scaling-stroke"/>`; }
  if(d) d.sites.forEach(st=>{ const fl=j.field[st.no]||{}, e=eff(st,fl,j), p=f(e.ch,e.offD);
    const fill=fl.status==="moved"?"#D99A06":fl.status==="done"?"#FFFFFF":"#16B28B", tc=fl.status==="done"?"#0C272E":"#FFFFFF";
    s+=`<circle cx="${p[0]}" cy="${p[1]}" r="${R}" fill="${fill}" stroke="${fl.status==="done"?"#16B28B":"#FFFFFF"}" stroke-width="${R*0.2}"/><text x="${p[0]}" y="${p[1]}" fill="${tc}" font-family="IBM Plex Mono,Menlo,monospace" font-weight="600" font-size="${R*1.05}" text-anchor="middle" dominant-baseline="central">${st.no}</text>`; });
  return s+"</svg>";
}
function calMarksSVG(j){

    <td class="n"><b id="od_${s.no}">${f1o(setOff(s,f).d)}</b></td><td class="n" id="ol_${s.no}">${f1o(setOff(s,f).e)}</td></tr>`; }).join("")}</tbody></table></div>

function reportHTML(j){ syncWidths(j); return withJob(j,()=>{

async function savePDF(list,name,btn){

  try{
    await loadScript("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js");

      await new Promise((res,rej)=>{ frame.onload=res; frame.onerror=rej; frame.srcdoc=html; setTimeout(res,3000); });
      doc=frame.contentDocument; pages=doc?[...doc.querySelectorAll(".rp")]:[]; if(!pages.length) throw new Error("frame");
    }catch(e){ if(frame) frame.remove(); frame=null; doc=document;
      const box=document.createElement("div"); box.id="pdfBox"; box.style.cssText="position:fixed;left:-12000px;top:0;width:794px;background:#fff;z-index:-1";
      box.innerHTML=`<style>${REPORT_CSS}.rp{box-shadow:none!important;margin:0!important}</style>`+list.map(reportHTML).join(""); document.body.appendChild(box); pages=[...box.querySelectorAll(".rp")]; }
    await new Promise(r=>setTimeout(r,250)); if(doc.fonts&&doc.fonts.ready) await doc.fonts.ready;
    const pdf=new window.jspdf.jsPDF({orientation:"p",unit:"mm",format:"a4",compress:true});
    for(let i=0;i<pages.length;i++){ const cv=await window.html2canvas(pages[i],{scale:2,backgroundColor:"#ffffff",useCORS:true,logging:false});
      const ph=297, pw=210, h=cv.height*pw/cv.width; if(i) pdf.addPage();
      if(h<=ph+0.5) pdf.addImage(cv.toDataURL("image/jpeg",0.92),"JPEG",0,0,pw,Math.min(h,ph));
      else { const sliceH=Math.floor(cv.width*ph/pw); for(let y=0,n=0;y<cv.height;y+=sliceH,n++){ const c2=document.createElement("canvas"); c2.width=cv.width; c2.height=Math.min(sliceH,cv.height-y); c2.getContext("2d").drawImage(cv,0,-y); if(n) pdf.addPage(); pdf.addImage(c2.toDataURL("image/jpeg",0.92),"JPEG",0,0,pw,c2.height*pw/cv.width); } } }
    if(frame) frame.remove(); const bx=document.getElementById("pdfBox"); if(bx) bx.remove();
    await saveFile(name,pdf.output("blob"),"application/pdf");

}

  if(d.basis==="qty") return ["Sample,Random r,Take at ("+S.qty.unit+"),Status",...d.sites.map(s=>[s.no,s.r.toFixed(4),s.val.toFixed(2),(S.field[s.no]||{}).status||""].join(","))].join("\n");
  const rows=[["Lot","Site","Sub-lot","Run","r1","Chainage exact",posLabel()+" set-out","r_w","Lot width (m)","Measured width (m)","Wn (m)","From near edge (m)","From datum (m)","From near edge set-out (m)","From datum set-out (m)"]];
  d.sites.forEach(s=>{ const f=S.field[s.no]||{}, e=eff(s,f), so=setOff(s,f), Wn=isFinite(num(f.measW))?Math.max(0,num(f.measW)-2*(num(S.exclJoint)||0)):s.Wn; rows.push([S.job.lotNo,s.no,s.stratum||"",s.laneName,s.rl.toFixed(4),s.ch.toFixed(3),fmtPos(siteCh(s)),s.rw.toFixed(4),s.W.toFixed(2),f.measW||"",Wn.toFixed(3),e.offL.toFixed(3),e.offD.toFixed(3),so.e.toFixed(1),so.d.toFixed(1)]); });
  return rows.map(r=>r.map(q).join(",")).join("\n"); }
async function saveFile(name,data,mime){
  if(window.claude&&window.claude.use){ const dl=await window.claude.use("downloads").catch(()=>null);
    if(!dl){ toast("Saving files isn't available in this view."); return; }
    try{ await dl.save({filename:name,data}); toast("Saved "+name); }catch(err){ if(err&&err.code!=="declined") toast("Couldn't save: "+(err.message||err.code)); } return; }
  const url=URL.createObjectURL(new Blob([data],{type:mime})); const a=document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),3000); toast("Saved "+name);
}

/* photo */
/* drag a chainage point */
let dragPt=null, dragMoved=false;
document.addEventListener("pointerdown",e=>{ const h=e.target.closest&&e.target.closest(".calh"); if(!h||step!=="map") return;
  const mi=$("#mapinner"); if(!mi) return; e.preventDefault(); dragPt={i:+h.dataset.pt,id:e.pointerId}; dragMoved=false; mi.classList.add("dragging"); try{ mi.setPointerCapture(e.pointerId); }catch(err){} });
document.addEventListener("pointermove",e=>{ if(!dragPt||e.pointerId!==dragPt.id) return; const img=$("#mapinner img"); if(!img) return; e.preventDefault();
  const r=img.getBoundingClientRect(), p=S.cal.pts[dragPt.i]; if(!p) return;
  p.x=Math.min(S.photoW,Math.max(0,(e.clientX-r.left)/r.width*S.photoW)); p.y=Math.min(S.photoH,Math.max(0,(e.clientY-r.top)/r.height*S.photoH)); dragMoved=true; refreshOverlay(); });
const endDrag=e=>{ if(!dragPt||(e.pointerId!==undefined&&e.pointerId!==dragPt.id)) return; const mi=$("#mapinner"); if(mi) mi.classList.remove("dragging"); dragPt=null; if(dragMoved) save(); };
document.addEventListener("pointerup",endDrag); document.addEventListener("pointercancel",endDrag);
/* drop or paste a drawing */
const hasFiles=e=>e.dataTransfer&&[...(e.dataTransfer.types||[])].includes("Files");
document.addEventListener("dragover",e=>{ if(!hasFiles(e)) return; e.preventDefault(); if(step==="map"){ e.dataTransfer.dropEffect="copy"; $("#main").classList.add("dropping"); } else e.dataTransfer.dropEffect="none"; });
document.addEventListener("dragleave",e=>{ if(e.relatedTarget==null) $("#main").classList.remove("dropping"); });
document.addEventListener("drop",e=>{ if(!hasFiles(e)) return; e.preventDefault(); $("#main").classList.remove("dropping"); if(step!=="map"){ toast("Open the Plan tab to add a drawing."); return; }
  const f=[...e.dataTransfer.files].find(x=>/^image\//.test(x.type)); if(f){ onPhoto(f); } else toast("That file isn't an image. Save the drawing as a JPG or PNG, or take a photo of it."); });
document.addEventListener("paste",e=>{ if(step!=="map") return; const f=[...((e.clipboardData&&e.clipboardData.files)||[])].find(x=>/^image\//.test(x.type)); if(f){ e.preventDefault(); onPhoto(f); } });
function onPhoto(file){ if(!file) return; const rd=new FileReader(); rd.onload=()=>{ const img=new Image(); img.onload=()=>{ const max=2000, sc=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement("canvas"); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc); c.getContext("2d").drawImage(img,0,0,c.width,c.height);
  S.photo=c.toDataURL("image/jpeg",0.82); S.photoW=c.width; S.photoH=c.height; S.cal=blankCal(); armed=true; zoom=1; save(); render(); toast("Tap the drawing where you can read a chainage."); }; img.src=rd.result; }; rd.readAsDataURL(file); }
$("#fileCam").onchange=e=>{ onPhoto(e.target.files[0]); e.target.value=""; };
$("#filePick").onchange=e=>{ onPhoto(e.target.files[0]); e.target.value=""; };
$("#fileImport").onchange=async e=>{ let n=0; for(const f of e.target.files){ try{ const txt=await f.text(); const mm=txt.match(/<script type="application\/json" id="rsl-lots">([\s\S]*?)<\/script>/); const o=JSON.parse(mm?mm[1]:txt); const list=o&&o.lots?o.lots:[o];
    list.forEach(j=>{ if(!j||!j.lanes||!j.job) return; normalise(j); if(jobs[j.id]&&jobs[j.id].updated>=j.updated) return; jobs[j.id]=j; persist(j); n++; S=j; }); }catch(err){} }
  e.target.value=""; if(n){ closeSheet(); go("lot"); toast(n+" lot"+(n>1?"s":"")+" imported"); } else toast("No new lots found in that file."); };

/* lots sheet */
function openSheet(){
  const list=Object.values(jobs).sort((a,b)=>(b.job.date||"").localeCompare(a.job.date||"")||b.updated.localeCompare(a.updated));
  const days={}; list.forEach(x=>{ (days[x.job.date||"No date"]=days[x.job.date||"No date"]||[]).push(x); });
  $("#sheetHost").innerHTML=`<div class="scrim" id="scrim"><div class="sheet"><div class="row"><h2 style="flex:1">Lots on this phone</h2><button class="btn small ghost" data-act="closeSheet" type="button">Close</button></div>
  <div class="row"><button class="btn primary" data-act="nextLot" type="button">Next lot, same job</button><button class="btn" data-act="newProject" type="button">New job</button><button class="btn ghost" data-act="import" type="button">Import</button></div>
  <p class="hint">Every lot saves on this phone as you go, with or without signal. Back at the lab, tick the lots and save their reports in one PDF (and HTML to reopen later). Lots stay until you delete them; clearing the browser's data also clears them.</p>
  <p class="hint" style="font-size:.8rem">App version ${APP_VERSION}</p>
  ${sel.size?`<div class="row" style="background:var(--accent-soft);padding:8px;border-radius:8px"><b style="flex:1">${sel.size} selected</b><button class="btn small primary" data-act="savePDFSel" type="button">Save PDF</button><button class="btn small" data-act="saveSel" type="button">Save HTML</button><button class="btn small" data-act="exportSel" type="button">Lot files</button></div>`:""}
  <div class="joblist">${Object.entries(days).map(([day,xs])=>`<div class="row"><span class="daylabel" style="flex:1">${esc(day===today()?"Today":day)}</span><button class="btn small ghost" data-act="selDay" data-ids="${xs.map(x=>x.id).join(",")}" type="button">Select all</button></div>
   ${xs.map(x=>{ const pr=progress(x); return `<div class="job ${x.id===S.id?"cur":""}"><input type="checkbox" data-sel="${x.id}" ${sel.has(x.id)?"checked":""} aria-label="Select lot"><div><b>Lot ${esc(x.job.lotNo||"–")} · ${esc(x.job.project||x.job.client||"Untitled")}</b><small>${esc(METHODS[x.method].title)} · ${pr.n?pr.n+" sites":"not drawn"}</small></div>
   <button class="btn small" data-act="openJob" data-id="${x.id}" type="button">Open</button><button class="btn small ghost" data-act="askDel" data-id="${x.id}" type="button">Delete</button></div>
   ${pendingDelete===x.id?`<div class="confirm"><b>Delete lot ${esc(x.job.lotNo||"")} from this phone?</b><span>Save its report first if the lab needs it.</span><div class="row"><button class="btn small" data-act="noDel" type="button">Keep</button><button class="btn small dark" data-act="yesDel" type="button">Delete</button></div></div>`:""}`; }).join("")}`).join("")}</div></div></div>`;
}
function openGuide(){ let gh=$("#guideHost"); if(!gh){ gh=document.createElement("div"); gh.id="guideHost"; document.body.appendChild(gh); }
  gh.innerHTML=`<div class="gsheet" role="dialog" aria-label="Field guide"><div class="gbar"><b>Field guide</b><a class="btn small ghost" href="guide.html" target="_blank" rel="noopener">Open in new tab</a><button class="btn small dark" data-act="closeGuide" type="button">Close</button></div><iframe src="guide.html" title="Field guide"></iframe></div>`; }
function closeSheet(){ pendingDelete=null; $("#sheetHost").innerHTML=""; }

let _rw=window.innerWidth; window.addEventListener("resize",()=>{ if(step==="report") fitReport(); if(Math.abs(window.innerWidth-_rw)>40&&(step==="lot"||step==="draw")){ _rw=window.innerWidth; if(step==="lot") refreshLot(); else render(); } });
// Whatever starts printing (the Print button, Ctrl+P, the phone's Share > Print), print the full report, never the screen.
function preparePrint(){ flush(); let pa=$("#printArea"); if(!pa){ pa=document.createElement("div"); pa.id="printArea"; document.body.appendChild(pa); }
  const root=pa.shadowRoot||pa.attachShadow({mode:"open"}); root.innerHTML=`<style>${REPORT_CSS}</style>`+reportHTML(S); document.body.classList.add("printing"); }
window.addEventListener("beforeprint",()=>{ if(!document.body.classList.contains("printing")) preparePrint(); });
if(window.matchMedia){ try{ window.matchMedia("print").addEventListener("change",m=>{ if(m.matches&&!document.body.classList.contains("printing")) preparePrint(); }); }catch(e){} }
window.addEventListener("afterprint",()=>{ document.body.classList.remove("printing"); const pa=$("#printArea"); if(pa&&pa.shadowRoot) pa.shadowRoot.innerHTML=""; });
loadAll().then(()=>{ render(); });
// offline use + home-screen app: only on the hosted copy (it ships a manifest)
if(document.querySelector('link[rel="manifest"]') && "serviceWorker" in navigator && (location.protocol==="https:" || location.hostname==="localhost")){ try{ navigator.serviceWorker.register("sw.js").catch(()=>{}); }catch(e){} }
